name: Update archive and deploy

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Collect new and changed stories, and merge any photo sets uploaded to collector/manual.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect stories from Exposure
        run: |
          pip install pillow
          python collector/collect.py
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save updated data
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add public/data reports collector/cover-hashes.json
          git diff --cached --quiet || git commit -m "data: update archive $(date -u +%Y-%m-%d)"
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
